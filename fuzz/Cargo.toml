# Coverage-guided fuzz targets for RackSmith (run with `cargo +nightly fuzz`; see README.md).
#
# This is a separate cargo project, not a member of the root workspace: libFuzzer instrumentation
# needs a nightly compiler, while the workspace is pinned to stable. The empty `[workspace]` table
# below keeps cargo from treating this package as part of the parent workspace.
[package]
name = "racksmith-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
racksmith-domain = { path = "../crates/racksmith-domain" }

# A standalone project cannot inherit `[workspace.lints]`, so the root policy is restated here
# verbatim. `cargo xtask arch` fails if this copy differs from the root table in any way.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Pragmatic group exemptions
module_name_repetitions = "allow"
multiple_crate_versions = "allow"   # transitive duplicates are governed by cargo-deny instead
cargo_common_metadata = "allow"     # crates are not published to crates.io yet
# Selected restriction lints: no hidden panics, no silent escape hatches
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
fn_to_numeric_cast_any = "deny"
undocumented_unsafe_blocks = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
mod_module_files = "deny"          # module files are named after the module (`foo.rs` + `foo/`), never `mod.rs`
shadow_unrelated = "deny"
str_to_string = "deny"
implicit_clone = "deny"          # replaces the removed `string_to_string` lint
tests_outside_test_module = "deny"
try_err = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
missing_assert_message = "deny"
large_include_file = "deny"
error_impl_error = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
cognitive_complexity = "deny"   # nursery lint; threshold in clippy.toml

[[bin]]
name = "parse_mac"
path = "fuzz_targets/parse_mac.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_hostname"
path = "fuzz_targets/parse_hostname.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_machine_id"
path = "fuzz_targets/parse_machine_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lifecycle_sequence"
path = "fuzz_targets/lifecycle_sequence.rs"
test = false
doc = false
bench = false
