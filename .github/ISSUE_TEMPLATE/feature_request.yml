name: Feature request
description: Propose new behavior for RackSmith.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior you want. API shapes, CLI examples or lifecycle changes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including how MAAS or other tools handle this.
  - type: dropdown
    id: lifecycle
    attributes:
      label: Does this change the machine lifecycle (states, events or transitions)?
      description: Lifecycle changes must update the transition table, the TLA+ model and the Kani/proptest invariants together.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
