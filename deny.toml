# cargo-deny policy: licenses, security advisories, banned crates and allowed sources.
# Run with `cargo deny check` (part of `cargo xtask ci`). Schema:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# Loosening anything here (a new license, an ignored advisory, an unbanned crate) is a
# supply-chain decision: explain it in the PR, and add a `reason` to every exception.

[graph]
all-features = true

[output]
feature-depth = 1

# Vulnerabilities are always errors. Unmaintained and unsound crates are errors anywhere in the
# graph; yanked versions are errors too.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# RackSmith is Apache-2.0. Only permissive licenses compatible with it are allowed; copyleft
# (GPL, LGPL, AGPL, MPL, EPL, ...) is rejected.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allowlist is a policy, not an inventory: keep permitted licenses even when unused today.
unused-allowed-license = "allow"
exceptions = [
    # libfuzzer-sys vendors LLVM's libFuzzer (NCSA, a permissive BSD-style license). It is used
    # only by the separate fuzz/ project, which is never distributed.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Workspace crates are `publish = false` but still licensed Apache-2.0; check them too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version and are not wildcards.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "openssl", reason = "TLS must use rustls: pure Rust, no system OpenSSL to patch or link" },
    { crate = "openssl-sys", reason = "TLS must use rustls: pure Rust, no system OpenSSL to patch or link" },
]
skip = []
skip-tree = []

# Only crates.io. Git dependencies and other registries are rejected outright.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
