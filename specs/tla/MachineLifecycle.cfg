\* TLC model for MachineLifecycle.tla. Run it with ./check.sh.
\*
\* Three machines exercise interleaving between independent machines while
\* keeping the state space small enough for every pull request.
\* SYMMETRY is deliberately not used: it is unsound together with liveness checking.

CONSTANT Machines = {m1, m2, m3}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    DeployedOnlyFromDeploying
    DeployRequiresAllocation

PROPERTIES
    BrokenEventuallyReady
