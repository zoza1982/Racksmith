# Requirements traceability for RackSmith, checked by `cargo xtask spec` (and in CI).
#
# This file is the completeness matrix of ADR 0035 (docs/adr/0035-completeness-layer.md); the rules
# for agents are in the "Completeness" section of AGENTS.md. Nothing designed may be missing
# silently: every gap is built, explicitly rejected, or tracked by an open M1 plan task.
#
# [sections."<N.M>"] classifies every leaf section of docs/design/system-design.md. `title` must
# equal the heading text after the number. `status` is one of:
#   implemented  entry_points (code paths) and tests (that prove it)
#   partial      tasks and missing (what is not built yet), optionally entry_points and tests
#   planned      tasks
#   informative  reason (why the section states no buildable requirement)
#
# [inputs."<package>::<Type>.<member>"] classifies every field and variant of every type that
# derives serde Deserialize or clap Parser/Args/Subcommand/ValueEnum in product non-test code
# (a tuple variant's payload is `<Type>.<Variant>.0`), plus the inputs no derive declares:
# `<package>::route.<pattern>.<param>` for every `{param}` of a router path pattern and
# `<package>::env.<NAME>` for every environment variable read at run time:
#   implemented  effect_tests (changing the input changes an observable outcome)
#   rejected     tasks and tests (admission rejects it with a typed error naming the field)
#
# Tasks are M1 plan task IDs from docs/plan/m1.md, always written `M1-<ID>`; a struck-through
# (done) or unknown task is an error. Tests are `<package>::<libtest path>` as printed by
# `cargo test -p <package> -- --list`. docs/requirements.md is generated from this file:
# run `cargo xtask spec --fix` after editing it.


